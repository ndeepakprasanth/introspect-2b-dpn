replicaCount: 1
image:
  repository: "946248011760.dkr.ecr.us-east-1.amazonaws.com/introspect-sample-service"
  tag: "latest"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
resources: {}

# ServiceAccount configuration - set annotations to configure IRSA role annotation
serviceAccount:
  create: true
  # If name is empty, a default will be generated using the release name
  name: ""
  annotations: {}

# Bedrock integration settings - env vars injected into the pod
bedrock:
  enabled: true
  modelId: "anthropic.claude-3-5-sonnet-20241022"  # Claude 3.5 Sonnet (available in us-east-1, no inference profile needed)
  authMode: "role"  # Use IAM role (IRSA) instead of profile

env:
  - name: BEDROCK_MODEL_ID
    value: "anthropic.claude-3-5-sonnet-20241022"
  - name: BEDROCK_AUTH_MODE
    value: "role"
  - name: AWS_REGION
    value: "us-east-1"
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
  - name: MOCKS_PATH
    value: "/app/mocks"
  - name: LOG_LEVEL
    value: "INFO"

# Observability - CloudWatch Logs configuration
observability:
  enabled: true
  cloudwatch:
    enabled: true
    logRetention: 30  # days

# Pod labels for CloudWatch and service discovery
podLabels:
  app: sample-service
  environment: dev
  component: api

# Pod annotations for CloudWatch
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

extraVolumeMounts:
  - name: mocks
    mountPath: /app/mocks
    readOnly: true

extraVolumes:
  - name: mocks
    configMap:
      name: sample-mocks
