apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sample-service
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | default "sample-service" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name | default "sample-service" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.podLabels }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ if .Values.serviceAccount.name }}{{ .Values.serviceAccount.name }}{{ else }}{{ .Release.Name }}-sample-service{{ end }}
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: sample-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
{{- with .Values.env }}
{{ toYaml . | indent 12 }}
{{- end }}
{{- with .Values.extraVolumeMounts }}
          volumeMounts:
{{ toYaml . | indent 12 }}
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- with .Values.extraVolumes }}
      volumes:
{{ toYaml . | indent 8 }}
{{- end }}
